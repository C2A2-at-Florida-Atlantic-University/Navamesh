[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "navamesh"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "meshtastic",
    "paho-mqtt",
    "pypubsub",
    "python-dotenv",
    "pyserial",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]",
    "influxdb-client",
]

[project.scripts]
navamesh-bridge  = "navamesh._bridge:main"
navamesh-ingest  = "navamesh.mqtt_to_db:main"

[tool.setuptools.packages.find]
where = ["src"]
