[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "navamesh"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "meshtastic",
    "paho-mqtt",
    "pypubsub",
    "python-dotenv",
    "pyserial",
    # navamesh.SoilReading (PortNum 256) decoding; gencode asserts runtime >= 6.33.4
    "protobuf>=6.33.4",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]",
    "influxdb-client",
]
test = [
    "pytest",
]

[project.scripts]
navamesh-bridge  = "navamesh._bridge:main"
navamesh-ingest  = "navamesh.mqtt_to_db:main"
navamesh-sync-admin = "navamesh.sync_admin:main"
navamesh-cmd     = "navamesh.cmd_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
